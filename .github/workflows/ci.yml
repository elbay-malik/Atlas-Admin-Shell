name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # nx-set-shas needs this to locate the last successful run on main
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # full history for affected-commit resolution, treeless to stay fast
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: main

      - run: pnpm exec nx affected -t lint test build
      # enable once the Playwright federation e2e suite lands (slice 2):
      # - run: pnpm exec nx affected -t e2e-ci
