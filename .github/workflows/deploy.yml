name: Deploy

# Inert until Cloudflare credentials exist. The guard job below reports whether
# they are configured, and every deploy job is skipped when they are not, so a
# fork or a fresh clone never sees a red build for a deploy it cannot perform.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which manifest to publish alongside the shell
        type: choice
        # Only environments that actually have a deploy/manifests/<env>/ entry
        # belong here. `preview` was listed before one existed, and choosing it
        # published all three remotes and only then failed on the shell — see
        # deploy/manifests/README.md for why preview needs an edge router first.
        # Adding an environment means adding the directory AND this option.
        options: [production]
        default: production

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        # `secrets` is available to a step, unlike a job-level `if`.
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are not configured — skipping deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable it."
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ATLAS_ENV: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --require is the pre-flight: it asserts the SELECTED environment exists
      # before a single upload happens. Validating whatever manifests happen to
      # be present does not answer "can this deploy proceed", and the uploads
      # start on the next step.
      - run: node tools/check-manifests.mjs --require "$ATLAS_ENV"

      # Shell first. Remotes take the shell's copy of every shared library, so a
      # remote that uses a newly added export needs the new shell in place; an
      # old remote in front of the new shell is only offered more than it needs.
      #
      # The environment is applied to the BUILT artifact by the deploy target
      # itself, immediately before upload. It deliberately is NOT a separate step:
      # the deploy target depends on `build`, so anything run between the two
      # would be silently reverted when Nx re-ran the build (ADR-0010).
      - run: pnpm exec nx run shell:deploy

      - run: pnpm exec nx run-many -t deploy -p iam,feature-flags,audit-logs
